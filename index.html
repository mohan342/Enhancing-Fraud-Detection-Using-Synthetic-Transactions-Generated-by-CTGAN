<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Detection App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Fraud Detection App</h1>
      <p>Enter transaction details below.</p>

      <div class="form-grid">
        <input type="number" id="v1" placeholder="V1">
        <input type="number" id="v2" placeholder="V2">
        <input type="number" id="v3" placeholder="V3">
        <input type="number" id="v4" placeholder="V4">
        <input type="number" id="amount" placeholder="Amount">
      </div>

      <button id="predictBtn">Predict</button>

      <div class="result-box" id="resultBox">Prediction will appear here.</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
